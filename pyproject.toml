[project]
name = "text-classification"
version = "0.1.0"
description = "中文文本分类实验项目：BERT微调、BERT蒸馏到TextCNN、随机森林+FastText"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# BERT 微调 + Flask API
bert = [
    "torch>=2.0",
    "transformers>=4.30",
    "scikit-learn>=1.3",
    "flask>=2.3",
]

# FastText + 随机森林
fasttext = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "jieba>=0.42",
    "fasttext>=0.9",
    "flask>=2.3",
    "icecream>=2.1",
    "requests>=2.31",
]

# BERT 蒸馏到 TextCNN（继承 bert 依赖）
distil = [
    "torch>=2.0",
    "transformers>=4.30",
    "scikit-learn>=1.3",
]

# 全部依赖
all = [
    "torch>=2.0",
    "transformers>=4.30",
    "scikit-learn>=1.3",
    "flask>=2.3",
    "pandas>=2.0",
    "jieba>=0.42",
    "fasttext>=0.9",
    "icecream>=2.1",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []
